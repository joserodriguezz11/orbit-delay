    const templateEl = document.querySelector('script[type="__bundler/template"]');

    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

        s.textContent = await r.text();

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

ode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"84e03b83-d88c-4c57-814c-a0522191e27c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* greek */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1fe3be28-5c08-4428-9dbb-d4c5c22cb28e\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c8f020e9-6836-480e-8137-bfce7dbd24fc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"84e03b83-d88c-4c57-814c-a0522191e27c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* Synthios Records — Color tokens\n   LIGHT-FIRST palette, taken from the Logo-Light lockup: warm Bone background,\n   ink text, lavender-grey muted copy, and a single red signature accent (#E30E0E,\n   the logo \"IOS\"). Token families stay named --voltage-* / --ember-* (both red) for\n   back-compat. Logo-Dark is the one intentionally dark surface. */\n\n:root {\n  /* ---- Base scales ---- */\n\n  /* Ink — near-black, faintly blue. Primary dark surfaces. */\n  --ink-900: #08080C;\n  --ink-850: #0C0C12;\n  --ink-800: #111119;\n  --ink-700: #181822;\n  --ink-600: #21212D;\n  --ink-500: #2D2D3A;\n  --ink-400: #3B3B4A;\n\n  /* Bone — warm off-white. Light surfaces + text on dark. */\n  --bone-50:  #F5F1E8;\n  --bone-100: #ECE7DA;\n  --bone-200: #DAD4C4;\n  --bone-300: #B8B1A0;\n\n  /* Smoke — neutral grey text scale, tuned to read on the light Bone background\n     (darker = stronger). Slight cool/lavender cast. */\n  --smoke-100: #9A9AA8;   /* lightest muted */\n  --smoke-200: #6F6F80;   /* secondary text */\n  --smoke-300: #565666;   /* muted text */\n  --smoke-400: #3C3C48;   /* strong muted */\n\n  /* ---- Signature accents ---- */\n\n  /* Signal — red (the logo \"IOS\" accent). The brand's single signature accent.\n     Token family kept as --voltage-* for back-compat. */\n  --voltage-300: #FF5C5C;\n  --voltage-400: #E30E0E;   /* core — #E30E0E */\n  --voltage-500: #C40A0A;\n  --voltage-600: #9E0808;\n\n  /* Ember — the same red, used for \"live\" / \"now playing\" states.\n     Token family kept as --ember-* for back-compat. */\n  --ember-300: #FF5C5C;\n  --ember-400: #E30E0E;   /* core — #E30E0E */\n  --ember-500: #C40A0A;\n  --ember-600: #9E0808;\n\n  /* Tape — muted gold for accents on light surfaces / vintage cues. */\n  --tape-400: #C8A24A;\n\n  /* ---- Semantic status ---- */\n  --status-positive: #7CD66B;\n  --status-warning:  #F2B33A;\n  --status-negative: #E30E0E;\n  --status-info:     #5BC8E6;\n\n  /* ============================================================\n     SEMANTIC ALIASES  (use these in components, not raw scales)\n     ============================================================ */\n\n  /* Surfaces (light-first) */\n  --surface-base:    var(--bone-50);   /* page background */\n  --surface-raised:  #FFFFFF;          /* cards, panels */\n  --surface-overlay: #FFFFFF;          /* popovers, menus */\n  --surface-sunken:  var(--bone-100);  /* wells, track lists */\n  --surface-inverse: var(--ink-900);   /* dark blocks on light page */\n\n  /* Text */\n  --text-primary:   var(--ink-900);\n  --text-secondary: var(--smoke-200);\n  --text-muted:     var(--smoke-300);\n  --text-inverse:   var(--bone-50);    /* on dark/accent surfaces */\n  --text-on-accent: var(--bone-50);    /* light text on red */\n\n  /* Brand */\n  --brand:          var(--voltage-400);\n  --brand-strong:   var(--voltage-500);\n  --accent:         var(--ember-400);\n  --accent-strong:  var(--ember-500);\n\n  /* Lines + edges */\n  --border-subtle: rgba(8, 8, 12, 0.10);\n  --border-strong: rgba(8, 8, 12, 0.16);\n  --border-accent: var(--voltage-400);\n\n  /* Focus ring */\n  --ring: var(--voltage-400);\n}\n<\u002Fstyle>\n  <style>/* Synthios Records — Typography tokens */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Syne', 'Schibsted Grotesk', system-ui, sans-serif;   /* @kind font */\n  --font-sans:    'Schibsted Grotesk', system-ui, -apple-system, sans-serif;   /* @kind font */\n  --font-mono:    'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;   /* @kind font */\n\n  /* ---- Weights ---- */\n  --fw-regular:  400;   /* @kind other */\n  --fw-medium:   500;   /* @kind other */\n  --fw-semibold: 600;   /* @kind other */\n  --fw-bold:     700;   /* @kind other */\n  --fw-extra:    800;   /* @kind other */\n\n  /* ---- Type scale (fluid-ish, fixed px) ----\n     Display sizes use --font-display; text sizes use --font-sans. */\n  --fs-display-xl: 96px;   /* hero wordmark moments */\n  --fs-display-lg: 68px;\n  --fs-display-md: 48px;\n  --fs-display-sm: 34px;\n\n  --fs-heading-lg: 28px;\n  --fs-heading-md: 22px;\n  --fs-heading-sm: 18px;\n\n  --fs-body-lg: 18px;\n  --fs-body-md: 16px;   /* base */\n  --fs-body-sm: 14px;\n\n  --fs-label:   13px;\n  --fs-caption: 12px;\n  --fs-mono-sm: 12px;   /* catalog numbers, timecodes */\n\n  /* ---- Line heights ---- */\n  --lh-tight:   1.04;   /* @kind other */\n  --lh-snug:    1.18;   /* @kind other */\n  --lh-normal:  1.5;    /* @kind other */\n  --lh-relaxed: 1.65;   /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-display: -0.02em;   /* @kind other */\n  --ls-tight:   -0.01em;   /* @kind other */\n  --ls-normal:  0;         /* @kind other */\n  --ls-wide:    0.04em;    /* @kind other */\n  --ls-caps:    0.14em;    /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Synthios Records — Spacing & layout tokens. 4px base grid. */\n\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-wide: 1440px;\n  --gutter: 24px;\n\n  /* Common component sizing */\n  --control-h-sm: 32px;\n  --control-h-md: 40px;\n  --control-h-lg: 52px;\n}\n<\u002Fstyle>\n  <style>/* Synthios Records — Radii, borders, shadows, glows, motion */\n\n:root {\n  /* ---- Corner radii ---- (modern, lightly rounded; pills for controls) */\n  --r-none: 0;     /* @kind radius */\n  --r-xs: 4px;\n  --r-sm: 8px;\n  --r-md: 12px;\n  --r-lg: 18px;\n  --r-xl: 24px;\n  --r-pill: 999px;\n  --r-circle: 50%;\n\n  /* ---- Border widths ---- */\n  --bw-hair: 1px;     /* @kind other */\n  --bw-thick: 2px;    /* @kind other */\n\n  /* ---- Elevation (soft, on dark) ---- */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);\n  --shadow-md: 0 6px 20px rgba(0,0,0,0.45);\n  --shadow-lg: 0 18px 48px rgba(0,0,0,0.55);\n  --shadow-pop: 0 24px 64px rgba(0,0,0,0.65);\n\n  /* ---- Accent glows (signature — used sparingly on hover/active) ---- */\n  --glow-voltage: 0 0 0 1px rgba(227,14,14,0.5), 0 8px 28px rgba(227,14,14,0.22);\n  --glow-ember:   0 0 0 1px rgba(227,14,14,0.5), 0 8px 28px rgba(227,14,14,0.22);\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 360ms;   /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Synthios Records — global stylesheet entry point.\n   Consumers link THIS file. Keep it as @import lines only. */\n\n/* Synthios Records — Webfonts\n   NOTE: No brand font binaries were provided. These are Google Fonts substitutions:\n     - Syne            → display / headlines (expressive grotesque, art-label feel)\n     - Schibsted Grotesk → UI + body\n     - Space Mono      → catalog numbers, timecodes, metadata\n   Flagged to the user: swap these @import targets for licensed brand fonts when available. */\n\n/* latin-ext */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"dc0aea07-7c99-4345-9444-a6b838d9188c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"43447c79-8162-47d7-ba0c-eb2e850dcb8a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Schibsted Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"dc0aea07-7c99-4345-9444-a6b838d9188c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+0 0;\n  font-display: swap;\n  src: url(\"c8f020e9-6836-480e-8137-bfce7dbd24fc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"84e03b83-d88c-4c57-814c-a0522191e27c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* greek */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1fe3be28-5c08-4428-9dbb-d4c5c22cb28e\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c8f020e9-6836-480e-8137-bfce7dbd24fc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"84e03b83-d88c-4c57-814c-a0522191e27c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Synthios Records — Color tokens\n   LIGHT-FIRST palette, taken from the Logo-Light lockup: warm Bone background,\n   ink text, lavender-grey muted copy, and a single red signature accent (#E30E0E,\n   the logo \"IOS\"). Token families stay named --voltage-* / --ember-* (both red) for\n   back-compat. Logo-Dark is the one intentionally dark surface. */\n\n:root {\n  /* ---- Base scales ---- */\n\n  /* Ink — near-black, faintly blue. Primary dark surfaces. */\n  --ink-900: #08080C;\n  --ink-850: #0C0C12;\n  --ink-800: #111119;\n  --ink-700: #181822;\n  --ink-600: #21212D;\n  --ink-500: #2D2D3A;\n  --ink-400: #3B3B4A;\n\n  /* Bone — warm off-white. Light surfaces + text on dark. */\n  --bone-50:  #F5F1E8;\n  --bone-100: #ECE7DA;\n  --bone-200: #DAD4C4;\n  --bone-300: #B8B1A0;\n\n  /* Smoke — neutral grey text scale, tuned to read on the light Bone background\n     (darker = stronger). Slight cool/lavender cast. */\n  --smoke-100: #9A9AA8;   /* lightest muted */\n  --smoke-200: #6F6F80;   /* secondary text */\n  --smoke-300: #565666;   /* muted text */\n  --smoke-400: #3C3C48;   /* strong muted */\n\n  /* ---- Signature accents ---- */\n\n  /* Signal — red (the logo \"IOS\" accent). The brand's single signature accent.\n     Token family kept as --voltage-* for back-compat. */\n  --voltage-300: #FF5C5C;\n  --voltage-400: #E30E0E;   /* core — #E30E0E */\n  --voltage-500: #C40A0A;\n  --voltage-600: #9E0808;\n\n  /* Ember — the same red, used for \"live\" / \"now playing\" states.\n     Token family kept as --ember-* for back-compat. */\n  --ember-300: #FF5C5C;\n  --ember-400: #E30E0E;   /* core — #E30E0E */\n  --ember-500: #C40A0A;\n  --ember-600: #9E0808;\n\n  /* Tape — muted gold for accents on light surfaces / vintage cues. */\n  --tape-400: #C8A24A;\n\n  /* ---- Semantic status ---- */\n  --status-positive: #7CD66B;\n  --status-warning:  #F2B33A;\n  --status-negative: #E30E0E;\n  --status-info:     #5BC8E6;\n\n  /* ============================================================\n     SEMANTIC ALIASES  (use these in components, not raw scales)\n     ============================================================ */\n\n  /* Surfaces (light-first) */\n  --surface-base:    var(--bone-50);   /* page background */\n  --surface-raised:  #FFFFFF;          /* cards, panels */\n  --surface-overlay: #FFFFFF;          /* popovers, menus */\n  --surface-sunken:  var(--bone-100);  /* wells, track lists */\n  --surface-inverse: var(--ink-900);   /* dark blocks on light page */\n\n  /* Text */\n  --text-primary:   var(--ink-900);\n  --text-secondary: var(--smoke-200);\n  --text-muted:     var(--smoke-300);\n  --text-inverse:   var(--bone-50);    /* on dark/accent surfaces */\n  --text-on-accent: var(--bone-50);    /* light text on red */\n\n  /* Brand */\n  --brand:          var(--voltage-400);\n  --brand-strong:   var(--voltage-500);\n  --accent:         var(--ember-400);\n  --accent-strong:  var(--ember-500);\n\n  /* Lines + edges */\n  --border-subtle: rgba(8, 8, 12, 0.10);\n  --border-strong: rgba(8, 8, 12, 0.16);\n  --border-accent: var(--voltage-400);\n\n  /* Focus ring */\n  --ring: var(--voltage-400);\n}\n\n/* Synthios Records — Typography tokens */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Syne', 'Schibsted Grotesk', system-ui, sans-serif;   /* @kind font */\n  --font-sans:    'Schibsted Grotesk', system-ui, -apple-system, sans-serif;   /* @kind font */\n  --font-mono:    'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;   /* @kind font */\n\n  /* ---- Weights ---- */\n  --fw-regular:  400;   /* @kind other */\n  --fw-medium:   500;   /* @kind other */\n  --fw-semibold: 600;   /* @kind other */\n  --fw-bold:     700;   /* @kind other */\n  --fw-extra:    800;   /* @kind other */\n\n  /* ---- Type scale (fluid-ish, fixed px) ----\n     Display sizes use --font-display; text sizes use --font-sans. */\n  --fs-display-xl: 96px;   /* hero wordmark moments */\n  --fs-display-lg: 68px;\n  --fs-display-md: 48px;\n  --fs-display-sm: 34px;\n\n  --fs-heading-lg: 28px;\n  --fs-heading-md: 22px;\n  --fs-heading-sm: 18px;\n\n  --fs-body-lg: 18px;\n  --fs-body-md: 16px;   /* base */\n  --fs-body-sm: 14px;\n\n  --fs-label:   13px;\n  --fs-caption: 12px;\n  --fs-mono-sm: 12px;   /* catalog numbers, timecodes */\n\n  /* ---- Line heights ---- */\n  --lh-tight:   1.04;   /* @kind other */\n  --lh-snug:    1.18;   /* @kind other */\n  --lh-normal:  1.5;    /* @kind other */\n  --lh-relaxed: 1.65;   /* @kind other */\n\n  /* ---- Letter spacing ---- */\n  --ls-display: -0.02em;   /* @kind other */\n  --ls-tight:   -0.01em;   /* @kind other */\n  --ls-normal:  0;         /* @kind other */\n  --ls-wide:    0.04em;    /* @kind other */\n  --ls-caps:    0.14em;    /* @kind other */\n}\n\n/* Synthios Records — Spacing & layout tokens. 4px base grid. */\n\n:root {\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-wide: 1440px;\n  --gutter: 24px;\n\n  /* Common component sizing */\n  --control-h-sm: 32px;\n  --control-h-md: 40px;\n  --control-h-lg: 52px;\n}\n\n/* Synthios Records — Radii, borders, shadows, glows, motion */\n\n:root {\n  /* ---- Corner radii ---- (modern, lightly rounded; pills for controls) */\n  --r-none: 0;     /* @kind radius */\n  --r-xs: 4px;\n  --r-sm: 8px;\n  --r-md: 12px;\n  --r-lg: 18px;\n  --r-xl: 24px;\n  --r-pill: 999px;\n  --r-circle: 50%;\n\n  /* ---- Border widths ---- */\n  --bw-hair: 1px;     /* @kind other */\n  --bw-thick: 2px;    /* @kind other */\n\n  /* ---- Elevation (soft, on dark) ---- */\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);\n  --shadow-md: 0 6px 20px rgba(0,0,0,0.45);\n  --shadow-lg: 0 18px 48px rgba(0,0,0,0.55);\n  --shadow-pop: 0 24px 64px rgba(0,0,0,0.65);\n\n  /* ---- Accent glows (signature — used sparingly on hover/active) ---- */\n  --glow-voltage: 0 0 0 1px rgba(227,14,14,0.5), 0 8px 28px rgba(227,14,14,0.22);\n  --glow-ember:   0 0 0 1px rgba(227,14,14,0.5), 0 8px 28px rgba(227,14,14,0.22);\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast: 120ms;   /* @kind other */\n  --dur-base: 200ms;   /* @kind other */\n  --dur-slow: 360ms;   /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"d7639779-3ead-4d97-9227-6eb3c9cdb53d\"><\u002Fscript>\n  <style>\n    * { box-sizing: border-box; }\n    body{margin:0;background:#E7E2D5;font-family:var(--font-sans),system-ui,sans-serif;-webkit-font-smoothing:antialiased;}\n    a{color:#E30E0E;} a:hover{color:#8F0A0A;}\n    button{font-family:var(--font-mono),monospace;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;padding:40px 24px;\">\n  <div style=\"display:flex;flex-direction:column;gap:12px;margin:auto;transform-origin:top center;transform:{{ scaleT }};\">\n\n    <div data-screen-label=\"Orbit Full\" style=\"position:relative;width:1180px;height:720px;display:flex;flex-direction:column;background:#07070B;border:1px solid rgba(245,241,232,0.16);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(8,8,12,0.35), 0 4px 18px rgba(8,8,12,0.18);color:#F5F1E8;\">\n\n      <div style=\"height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid rgba(245,241,232,0.1);background:#0A0A11;position:relative;z-index:6;\">\n        <span style=\"font-family:var(--font-display),sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.02em;\">ORBIT<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:3px;background:rgba(245,241,232,0.05);border:1px solid rgba(245,241,232,0.12);border-radius:999px;padding:3px 5px;\">\n          <button onclick=\"{{ prevPreset }}\" style=\"width:22px;height:22px;border-radius:999px;border:none;background:transparent;color:rgba(245,241,232,0.6);cursor:pointer;font-size:12px;\" sty ype&quot;:&quot;boolean&quot;},&quot;colorField&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;full&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;warm&quot;],&quot;section&quot;:&quot;Visuals&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst h = React.createElement;\n\n/* ---------- helpers ---------- */\nfunction clamp01(v){ return Math.max(0, Math.min(1, v)); }\nfunction clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }\nfunction polar(cx, cy, r, deg){ const a=(deg-90)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }\nfunction arcPath(cx, cy, r, a0, a1){ const p0=polar(cx,cy,r,a0), p1=polar(cx,cy,r,a1); const large=Math.abs(a1-a0)>180?1:0; return 'M '+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2); }\nfunction snapTo(v, step){ const s=step||1; return Math.round(v/s)*s; }\n\nconst PW=990, PH=572;\nconst TH = { text:'#F5F1E8', dim:'rgba(245,241,232,0.55)', faint:'rgba(245,241,232,0.38)', line:'rgba(245,241,232,0.09)', line2:'rgba(245,241,232,0.18)', well:'rgba(245,241,232,0.05)', track:'rgba(245,241,232,0.16)', manual:'rgba(245,241,232,0.8)', pointer:'#F5F1E8', acc:'#E30E0E' };\n\nfunction msOfX(x){ return 40*Math.pow(22.5, x); }\nfunction msToX(ms){ return clamp01(Math.log(ms/40)/Math.log(22.5)); }\nconst DIVS=[['1/32',62.5],['1/16',125],['1/16.',187.5],['1/8',250],['1/8.',375],['1/4',500],['1/4.',750]];\nfunction nearestDiv(ms){ let bi=0,bd=1e9; DIVS.forEach(function(d,i){ const dd=Math.abs(d[1]-ms); if(dd<bd){bd=dd;bi=i;} }); return bi; }\n\n/* ---------- position → color (kept from Halo) ---------- */\nfunction posLCH(x, y, warm){\n  if(warm) return [0.55+0.10*x+0.06*y, 0.24-0.05*x, 29+61*x];\n  let hh=29+61*x-99*y; if(hh<0) hh+=360;\n  return [0.55+0.14*x+0.08*y, 0.23-0.04*x-0.03*y, hh];\n}\nfunction accCss(lch, a){ return 'oklch('+lch[0].toFixed(3)+' '+lch[1].toFixed(3)+' '+lch[2].toFixed(1)+' / '+(a==null?1:a.toFixed(3))+')'; }\n\n/* ---------- character themes ---------- */\nconst CHRS={\n  clean:{ bgTop:'#101019', bgBot:'#07070B', glow:1, hue:0, sat:1, scan:0, soft:1, wob:0, jit:0 },\n  tape: { bgTop:'#141009', bgBot:'#0A0705', glow:1.3, hue:16, sat:0.85, scan:0, soft:1.6, wob:1, jit:0 },\n  grit: { bgTop:'#130709', bgBot:'#070304', glow:0.85, hue:-8, sat:1.18, scan:0.45, soft:0.7, wob:0, jit:1 }\n};\nfunction tapLCH(x,y,warm,th){ const l=posLCH(x,y,warm); return [l[0], l[1]*th.sat, l[2]+th.hue]; }\n\n/* ---------- spring + Knob ---------- */\nfunction useSpring(target, k, c){\n  const forceR = React.useReducer(function(x){return x+1;},0);\n  const force = forceR[1];\n  const ref = React.useRef(null);\n  if(!ref.current) ref.current = { p:target, v:0, raf:0, t:target, last:0 };\n  const st = ref.current; st.t = target;\n  React.useEffect(function(){\n    if(st.p===st.t && Math.abs(st.v)<0.001) return;\n    if(!st.raf){\n      st.last = performance.now();\n      const loop = function(now){\n        const dt = Math.min(0.045, Math.max(0.001,(now-st.last)/1000)); st.last = now;\n        const acc = k*(st.t-st.p) - c*st.v; st.v += acc*dt; st.p += st.v*dt;\n        if(Math.abs(st.t-st.p)<0.0007 && Math.abs(st.v)<0.008){ st.p=st.t; st.v=0; st.raf=0; force(); return; }\n        st.raf = requestAnimationFrame(loop); force();\n      };\n      st.raf = requestAnimationFrame(loop);\n    }\n    return function(){ if(st.raf){ cancelAnimationFrame(st.raf); st.raf=0; } };\n  },[target]);\n  return st.p;\n}\nfunction Knob(p){\n  const S=p.size||60, min=p.min, max=p.max, step=p.step||1;\n  const feel=p.feel==null?55:p.feel, seed=p.seed||0;\n  const k=Math.max(50,(430-feel*3.4))*(1+seed*0.35);\n  const c=1.75*Math.sqrt(k)*(0.78+seed*0.22);\n  const n=clamp01(useSpring(clamp01((p.v-min)/(max-min)),k,c));\n  const shown=min+n*(max-min);\n  const r=S/2-5, cx=S/2, cy=S/2, va=-135+n*270;\n  const pe=polar(cx,cy,r,va), pi=polar(cx,cy,r*0.4,va);\n  const fill=p.linked?(p.accent||TH.acc):TH.manual;\n  const start=function(e){ e.preventDefa
